<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- ================= BASIC META ================= -->
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- ================= CANONICAL (IMPORTANT SEO FIX) ================= -->
    <link rel="canonical" href="https://novarsis.com/" />

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>


    <!-- ================= FAVICON & ICONS ================= -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png"/>
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/android-chrome-192x192.png"/>
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/android-chrome-512x512.png"/>
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png"/>
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <!-- ================= THEME ================= -->
    <meta name="theme-color" content="#00A3FF" />

    <!-- ================= AUTHOR ================= -->
    <meta name="author" content="Novarsis Technology" />
    <meta name="copyright" content="© 2025 Novarsis Technology" />

    <!-- ================= PRIMARY SEO ================= -->
    <title>Novarsis Technology | Innovative Software & IT Solutions</title>

    <meta
      name="description"
      content="Novarsis Technology offers professional software development, web design, digital marketing, and IT solutions to empower your business growth."
    />

    <meta
      name="keywords"
      content="software development, IT services, website design, mobile app development, digital marketing, branding, eCommerce, web solutions"
    />

    <!-- ================= GOOGLE SEO BOOST (NEW) ================= -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- ================= OPEN GRAPH ================= -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://novarsis.com/" />
    <meta property="og:title" content="Novarsis Technology | Software & IT Solutions Company" />
    <meta property="og:description" content="We build modern digital products — websites, apps, and marketing strategies that drive success." />
    <meta property="og:image" content="%PUBLIC_URL%/novarsis-og-image.jpg" />

    <!-- ================= TWITTER ================= -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Novarsis Technology | Software & IT Solutions" />
    <meta name="twitter:description" content="Expert in software development, web design, and digital transformation solutions." />
    <meta name="twitter:image" content="%PUBLIC_URL%/novarsis-og-image.jpg" />

    <!-- ================= PERFORMANCE SEO ================= -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
